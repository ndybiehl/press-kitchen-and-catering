# DigitalOcean Static Site — self-hosted Press site (public/)
name: press-kitchen-and-catering
region: sfo
static_sites:
  - name: web
    github:
      repo: ndybiehl/press-kitchen-and-catering
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    output_dir: public
    index_document: index.html
    error_document: index.html
    routes:
      - path: /
